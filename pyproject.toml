[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "course-aiml-autoencoders"
version = "0.1.0"
description = "An experiment-first course on autoencoders, VAEs, and VQ-VAEs."
authors = [{ name = "Tiago Silva" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "matplotlib>=3.8",
  "pyyaml>=6.0",
  "torch>=2.3",
  "torchvision>=0.18",
]

[project.scripts]
course-aiml-autoencoders = "course_aiml_autoencoders.cli:main"

[project.urls]
Repository = "https://github.com/tsilva/course-aiml-autoencoders"

[dependency-groups]
dev = [
  "ipykernel>=6.29,<8",
  "jupyterlab>=4.2,<5",
  "jupytext>=1.16,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/course_aiml_autoencoders"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.uv]
exclude-newer = "7 days"
constraint-dependencies = [
  "guardrails-ai!=0.10.1",
  "mistralai!=2.4.6",
]
